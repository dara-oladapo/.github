name: CI

# Builds and tests on all three desktop platforms, on every pull request and every push to the
# default branch.
#
# This matters more here than in most projects: with `MauiXamlInflator=SourceGen` the XAML is
# turned into C# at build time, so a mistyped StaticResource key or a binding path that doesn't
# exist on its x:DataType is a *build* error — exactly the class of mistake a human reading a diff
# will not catch, and that no test can reach.
#
# ---------------------------------------------------------------------------------------------
# Set these for the repo, then delete this comment. Drop the macos job entirely if the app has no
# Mac Catalyst target.
# ---------------------------------------------------------------------------------------------
env:
  CORE_PROJECT: src/Example.Core/Example.Core.csproj
  APP_PROJECT: src/Example.App/Example.App.csproj
  TEST_PROJECT: tests/Example.Core.Tests/Example.Core.Tests.csproj
  WINDOWS_TFM: net10.0-windows10.0.19041.0
  MACCATALYST_TFM: net10.0-maccatalyst

on:
  pull_request:
  push:
    branches:
      - $default-branch

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Explicit project paths, not the solution: a MAUI app project has no valid TargetFramework
      # on Linux, so a solution build fails here for reasons unrelated to the change.
      - name: Build Core
        run: dotnet build ${{ env.CORE_PROJECT }} --configuration Release -warnaserror

      - name: Test Core
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release -warnaserror

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # Core first: it needs no workload, so if the workload install is what's broken, the failure
      # stays readable instead of looking like a code problem.
      - name: Test Core
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release -warnaserror

      # -f is required: a plain build would also try the Mac Catalyst target, which this runner
      # has no toolchain for.
      #
      # Turn -warnaserror on only once the build reports zero warnings — a gate that is red on
      # arrival gets ignored or switched off. Once it's on, suppress a specific new warning code
      # with a comment saying why rather than dropping the flag.
      - name: Build app (compiles XAML)
        run: >
          dotnet build ${{ env.APP_PROJECT }}
          -f ${{ env.WINDOWS_TFM }}
          -c Release
          -warnaserror

  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # maui-maccatalyst, not maccatalyst. The bare `maccatalyst` workload installs the platform
      # SDK but not MAUI, and the build then fails with NETSDK1147 asking for maui-maccatalyst.
      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst

      # Core is tested on all three platforms rather than only Linux, and that is deliberate: it
      # is pure System.IO, which is exactly the code whose behaviour differs across platforms
      # (path roots, separators, drive enumeration). Running it in one place would test the one
      # place it is least likely to break.
      - name: Test Core
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release -warnaserror

      - name: Build app (Mac Catalyst)
        run: >
          dotnet build ${{ env.APP_PROJECT }}
          -f ${{ env.MACCATALYST_TFM }}
          -c Release
          -warnaserror

  # One check to require in branch protection instead of three. It also catches a job that was
  # skipped or cancelled, which a plain `needs` would let through green.
  all-green:
    name: All platforms green
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: always()
    steps:
      - name: Verify every platform succeeded
        run: |
          echo "linux=${{ needs.linux.result }} windows=${{ needs.windows.result }} macos=${{ needs.macos.result }}"
          if [ "${{ needs.linux.result }}" != "success" ] \
            || [ "${{ needs.windows.result }}" != "success" ] \
            || [ "${{ needs.macos.result }}" != "success" ]; then
            echo "::error::All three platforms must pass."
            exit 1
          fi
