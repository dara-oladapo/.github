name: Bug report
description: Something is broken, crashes, or behaves differently from what the screen says it will.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the org-wide default form, used by repos that don't define their own. If the repo you're filing against has its own set of forms, use those — they ask better questions than this one can.

        **If the app deleted, disabled or changed something on your machine and left it that way, say so in the first line.** That class of bug is triaged ahead of everything else, and some repos have a dedicated form for it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a freshly launched app. If it only happens sometimes, say roughly how often and what seems to bring it on.
      placeholder: |
        1. Open the app
        2. Go to Settings
        3. Turn on <the thing>
        4. Unplug the laptop
        5. Nothing happens, and the tray icon stops updating
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2 / macOS 15.2
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Machine
      description: Model, and any hardware the feature depends on. Skip it if the bug clearly has nothing to do with the hardware.
      placeholder: Lenovo Legion 5 Pro, RTX 3070 Ti + Radeon 680M

  - type: input
    id: version
    attributes:
      label: App version
      description: Usually on the About screen, or in the tray menu.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The installer from Releases
        - Built from source
    validations:
      required: true

  - type: checkboxes
    id: before
    attributes:
      label: Before you file
      options:
        - label: I've checked the repo's README for a "known gaps" or "not supported" note covering this.
        - label: I've searched existing issues, including closed ones.

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or error text
      description: For a crash, the error text matters more than a description of it. Paste it as text rather than a screenshot where you can — pasted text is searchable, a screenshot isn't.
